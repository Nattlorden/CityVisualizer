name: Validate MapExtractor

on:
  push:
    paths:
      - 'MapExtractor/**'
      - '.github/workflows/validate-mapextractor.yml'
  pull_request:
    paths:
      - 'MapExtractor/**'
      - '.github/workflows/validate-mapextractor.yml'

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install numpy opencv-python-headless shapely pillow
      - name: Compile all Python sources
        run: python -m compileall -q MapExtractor
      - name: Test separate inner boundary
        run: python -m unittest discover -s MapExtractor -p 'test_land_boundary.py'
